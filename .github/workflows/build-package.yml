name: msys2 dev-latest
on: [workflow_dispatch]
permissions:
  contents: write
# a new run supersedes the one in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
#on:
#  push:
#    branches:
#      - dev
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git p7zip

      - uses: actions/checkout@v7
        with: 
          #ref: dev
          fetch-depth: 0

      # _external/ holds the source-built exiv2/libavif/libheif prefixes and the
      # image format plugins; the .built-stamp mechanism inside build-qimgv.sh
      # decides what is reusable. Keyed on the script hash so version/option
      # changes start a fresh cache; restore-keys keeps comment-only edits cheap.
      - uses: actions/cache@v4
        with:
          path: _external
          key: qimgv-external-${{ hashFiles('scripts/build-qimgv.sh') }}
          restore-keys: qimgv-external-

      - id: build
        name: CI-Build
        run: |
          export BUILD_NAME="qimgv-x64_$(git describe --tags --always)"
          echo "build_name=${BUILD_NAME}" >> $GITHUB_OUTPUT
          echo "build_file_name=${BUILD_NAME}.zip" >> $GITHUB_OUTPUT
          ./scripts/build-qimgv.sh
          # Archive the contents of the package dir, not the dir itself, so that
          # one extraction yields qimgv.exe directly.
          ( cd "${BUILD_NAME}" && 7z a -tzip "../${BUILD_NAME}.zip" * )
          ls -al *.zip

      # archive: false uploads the zip as-is, so downloading the artifact gives
      # the release archive itself instead of a second zip wrapped around it.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.build_file_name }}
          archive: false

    outputs:
       build_name: ${{ steps.build.outputs.build_name }}
       build_file_name: ${{ steps.build.outputs.build_file_name }}

  upload-release:
    runs-on: ubuntu-24.04
    needs: build
    steps:
       # skip-decompress keeps the archive intact instead of unpacking it
       - uses: actions/download-artifact@v8
         with:
           name: ${{ needs.build.outputs.build_file_name }}
           skip-decompress: true

       - uses: softprops/action-gh-release@v3
         #if: startsWith(github.ref, 'refs/tags/')
         with:
           files: ${{ needs.build.outputs.build_file_name }}
           prerelease: true
           tag_name: latest-dev
           name: ${{ needs.build.outputs.build_name }}
           body: "Automated build"
